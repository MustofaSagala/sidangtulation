<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <meta property="og:description" content="Selamat Sidang">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selamat Sidang Tesis Nur Mustika Syahputri</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* =========================
           JANGAN KEPO
        ========================== */

        #countdown-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .countdown-box {
            max-width: 600px;
        }

        .countdown-box h1 {
            margin-bottom: 10px;
        }

        .countdown-box p {
            color: #666;
        }

        #countdown {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .time-box {
            min-width: 70px;
            padding: 15px 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .time-box span {
            display: block;
            font-size: 28px;
            font-weight: bold;
        }

        .time-box small {
            color: #777;
        }


      

        #main-content {
            display: none;
        }

        .ucapan {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .ucapan h1 {
            font-size: 40px;
        }
    </style>
</head>

<body>


  
    <section id="countdown-page">

        <div class="countdown-box">

            <h1>🙂</h1>

            <p>...
            </p>


            <div id="countdown">

                <div class="time-box">
                    <span id="days">00</span>
                    <small>Hari</small>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Jam</small>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Menit</small>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Detik</small>
                </div>

            </div>

        </div>

    </section>



  

    <main id="main-content">

        <section class="ucapan">

            <div>

                <h1>🙂</h1>
                

            </div>

        </section>

    </main>



    <script>

      

        const targetDate = new Date("2028-12-27T23:59:00+07:00");


        const countdownPage = document.getElementById("countdown-page");
        const mainContent = document.getElementById("main-content");


        const daysElement = document.getElementById("days");
        const hoursElement = document.getElementById("hours");
        const minutesElement = document.getElementById("minutes");
        const secondsElement = document.getElementById("seconds");


        function updateCountdown() {

            const now = new Date();

            const distance = targetDate - now;


          

            if (distance <= 0) {

                countdownPage.style.display = "none";

                mainContent.style.display = "block";

                return;

            }


           

            const days = Math.floor(
                distance / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (distance % (1000 * 60 * 60 * 24))
                / (1000 * 60 * 60)
            );

            const minutes = Math.floor(
                (distance % (1000 * 60 * 60))
                / (1000 * 60)
            );

            const seconds = Math.floor(
                (distance % (1000 * 60))
                / 1000
            );


            /*
            ============================================
            TAMPILKAN COUNTDOWN
            ============================================
            */

            daysElement.textContent =
                String(days).padStart(2, "0");

            hoursElement.textContent =
                String(hours).padStart(2, "0");

            minutesElement.textContent =
                String(minutes).padStart(2, "0");

            secondsElement.textContent =
                String(seconds).padStart(2, "0");

        }


       

        updateCountdown();


  

        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
